# TEMPORARY - benchmarks the ways of unpacking the src cache on the Windows
# build runners. Lives on a throwaway branch; delete with the branch.
name: TMP Windows src cache extraction benchmark

on:
  push:
    branches:
      - build/tmp-win-extract-bench

permissions: {}

jobs:
  setup:
    runs-on: ubuntu-slim
    permissions:
      contents: read
    outputs:
      build-image-sha: ${{ steps.build-image-sha.outputs.build-image-sha }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - id: build-image-sha
      uses: ./.github/actions/build-image-sha

  # Same as build.yml's checkout-windows: makes sure the win src cache exists
  # for this DEPS hash and mints a SAS token for it. Then, as the Linux
  # control group, unpacks the same cache here and cuts it into shards for the
  # parallel-extraction variants.
  prepare-linux:
    needs: setup
    runs-on: electron-arc-centralus-linux-amd64-32core
    permissions:
      contents: read
    container:
      image: ghcr.io/electron/build:${{ needs.setup.outputs.build-image-sha }}
      options: --user root --device /dev/fuse --cap-add SYS_ADMIN
      volumes:
        - /mnt/win-cache:/mnt/win-cache
        - /var/run/sas:/var/run/sas
    env:
      CHROMIUM_GIT_COOKIE: ${{ secrets.CHROMIUM_GIT_COOKIE }}
      CHROMIUM_GIT_COOKIE_WINDOWS_STRING: ${{ secrets.CHROMIUM_GIT_COOKIE_WINDOWS_STRING }}
      GCLIENT_EXTRA_ARGS: '--custom-var=checkout_win=True'
      TARGET_OS: 'win'
      ELECTRON_DEPOT_TOOLS_WIN_TOOLCHAIN: '1'
    outputs:
      cache-file: ${{ steps.info.outputs.cache-file }}
    steps:
    - name: Checkout Electron
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: src/electron
        fetch-depth: 0
    - name: Checkout & Sync & Save
      uses: ./src/electron/.github/actions/checkout
      with:
        generate-sas-token: 'true'
        target-platform: win
    - name: Export cache info
      id: info
      shell: bash
      run: |
        echo "cache-file=$CACHE_FILE" >> "$GITHUB_OUTPUT"
        ls -la "$CACHE_DRIVE/$CACHE_FILE"
    - name: Copy cache off the share
      shell: bash
      run: |
        mkdir -p bench
        s=$(date +%s); cp "$CACHE_DRIVE/$CACHE_FILE" bench/cache.tar.zst; e=$(date +%s)
        echo "copied $(du -m bench/cache.tar.zst | cut -f1) MiB from the share in $((e-s))s"
    - name: Unpack once and build shards
      shell: bash
      run: |
        cd bench
        mkdir tree
        s=$(date +%s%N); zstd -d --long=30 -c cache.tar.zst | tar -xf - -C tree; e=$(date +%s%N)
        echo "linux single-stream unpack: $(( (e-s)/1000000 )) ms" | tee unpack.txt
        python3 ../src/electron/script/tmp-extract-bench/count_tree.py tree | tee count.txt
        python3 ../src/electron/script/tmp-extract-bench/make_shards.py tree shards 16 | tee shards.txt
        du -sm shards cache.tar.zst
        # 20000 x 512B files in 40 dirs, used to measure the raw file-create path.
        python3 -c "
        import os
        for d in range(40):
            p = f'microsrc/micro/d{d}'; os.makedirs(p)
            for i in range(500): open(f'{p}/f{i}', 'wb').write(b'x' * 512)
        "
        tar -cf shards/micro.tar -C microsrc micro
    - name: Linux control benchmark
      shell: bash
      env:
        SCRIPT_DIR: ${{ github.workspace }}/src/electron/script/tmp-extract-bench
      run: |
        cd bench
        rm -rf tree
        echo "## Linux control (${RUNNER_NAME:-linux 32-core}, same cache file)" > results-linux.md
        echo "" >> results-linux.md
        cat unpack.txt count.txt >> results-linux.md
        echo "" >> results-linux.md
        CACHE_TARBALL=$PWD/cache.tar.zst SHARDS_DIR=$PWD/shards RESULTS=$PWD/results-linux.md \
          BENCH_ROOT=$PWD/root MICRO_TAR=$PWD/shards/micro.tar SCRIPT_DIR=$SCRIPT_DIR bash $SCRIPT_DIR/bench.sh
        cat results-linux.md >> "$GITHUB_STEP_SUMMARY"
    - name: Upload shards
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      with:
        name: win-cache-shards
        path: |
          bench/shards/*.tar.zst
          bench/shards/micro.tar
        compression-level: 0
        retention-days: 1
    - name: Upload linux results
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      with:
        name: results-linux
        path: |
          bench/results-linux.md
          bench/shards.txt
        retention-days: 7

  # The 16-core set is what build.yml uses today (D16lds_v5 nodes); the
  # 32-core set is the newer pool (D32ads_v7 nodes) - same container image and
  # emptyDir workspace, different VM generation and local disk.
  bench-windows:
    name: bench-windows (${{ matrix.pool }})
    needs: prepare-linux
    strategy:
      fail-fast: false
      matrix:
        pool: [16core, 32core]
    runs-on: electron-arc-centralus-windows-amd64-${{ matrix.pool }}
    timeout-minutes: 300
    permissions:
      contents: read
    env:
      CACHE_FILE: ${{ needs.prepare-linux.outputs.cache-file }}
      POOL: ${{ matrix.pool }}
    defaults:
      run:
        shell: bash
    steps:
    - name: Checkout bench scripts
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: src/electron
        sparse-checkout: script/tmp-extract-bench
    - name: Obtain SAS Key
      uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
      with:
        path: sas-token
        key: sas-key-win-${{ github.run_number }}-${{ github.run_attempt }}
        restore-keys: sas-key-win-${{ github.run_number }}-
        enableCrossOsArchive: true
        fail-on-cache-miss: true
    - name: Download src cache (azcopy)
      env:
        AZURE_AKS_WIN_CACHE_SHARE_NAME: windows-cache
      run: |
        mkdir -p bench
        sas_token=$(jq -r '.sasToken' sas-token)
        account_name=$(jq -r '.accountName' sas-token)
        rm -f sas-token
        s=$(date +%s)
        azcopy copy --log-level=ERROR "https://$account_name.file.core.windows.net/$AZURE_AKS_WIN_CACHE_SHARE_NAME/$CACHE_FILE?$sas_token" bench/cache.tar.zst
        e=$(date +%s)
        echo "AZCOPY_SECS=$((e-s))" >> "$GITHUB_ENV"
        ls -la bench/cache.tar.zst
    - name: Download shards
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: win-cache-shards
        path: bench/shards
    - name: Probe the runner
      shell: powershell
      continue-on-error: true
      run: powershell -ExecutionPolicy Bypass -File src/electron/script/tmp-extract-bench/probe.ps1 bench/probe.md
    - name: Run benchmarks
      env:
        SCRIPT_DIR: ${{ github.workspace }}/src/electron/script/tmp-extract-bench
      run: |
        cd bench
        SCRIPT_DIR=$(cygpath -u "$SCRIPT_DIR")
        R=$PWD/results-windows.md
        echo "## Windows build runner: ${POOL} pool ($RUNNER_NAME, $(nproc) cpus)" > "$R"
        echo "" >> "$R"
        echo "azcopy download of the cache: ${AZCOPY_SECS}s" >> "$R"
        echo "" >> "$R"
        LABEL="destination = workspace volume (NTFS as provisioned) on the build runner" \
          CACHE_TARBALL=$PWD/cache.tar.zst SHARDS_DIR=$PWD/shards RESULTS=$R \
          BENCH_ROOT=$PWD/root ALT_ROOT="$(cygpath -u "$TEMP")/extract-bench" MICRO_TAR=$PWD/shards/micro.tar SCRIPT_DIR=$SCRIPT_DIR \
          bash "$SCRIPT_DIR/bench.sh"
    - name: Try to create a ReFS Dev Drive on this runner
      id: refs
      shell: powershell
      continue-on-error: true
      run: powershell -ExecutionPolicy Bypass -File src/electron/script/tmp-extract-bench/make-refs-drive.ps1
    - name: Benchmark on the ReFS drive (if we got one)
      if: ${{ !cancelled() }}
      env:
        SCRIPT_DIR: ${{ github.workspace }}/src/electron/script/tmp-extract-bench
      run: |
        cd bench
        if [ -z "${REFS_ROOT:-}" ]; then
          { echo ""; echo "### ReFS on this runner: NOT AVAILABLE"; echo ""; echo "make-refs-drive.ps1 outcome: ${{ steps.refs.outcome }} - see that step's log (expected inside a container: no virtual-disk stack)."; } | tee -a results-windows.md
          exit 0
        fi
        SCRIPT_DIR=$(cygpath -u "$SCRIPT_DIR")
        SUITE=fs LABEL="destination = ${REFS_KIND} (${REFS_ROOT}) on the build runner" \
          CACHE_TARBALL=$PWD/cache.tar.zst SHARDS_DIR=$PWD/shards RESULTS=$PWD/results-windows.md \
          BENCH_ROOT="$(cygpath -u "$REFS_ROOT")/root" MICRO_TAR=$PWD/shards/micro.tar SCRIPT_DIR=$SCRIPT_DIR \
          bash "$SCRIPT_DIR/bench.sh"
    - name: Summary
      if: ${{ !cancelled() }}
      run: |
        cat bench/results-windows.md >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        cat bench/probe.md >> "$GITHUB_STEP_SUMMARY" || true
    - name: Upload results
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      with:
        name: results-windows-${{ matrix.pool }}
        path: |
          bench/results-windows.md
          bench/probe.md
        retention-days: 7

  # Same inputs on a GitHub-hosted Windows VM (a real VM, so a VHDX can be
  # mounted): the destination filesystem is the only variable between the
  # three passes - NTFS as shipped (Defender on), NTFS with the destination
  # excluded from Defender, and a trusted ReFS Dev Drive.
  bench-hosted-vm:
    needs: prepare-linux
    runs-on: windows-latest
    timeout-minutes: 240
    permissions:
      contents: read
    env:
      CACHE_FILE: ${{ needs.prepare-linux.outputs.cache-file }}
    defaults:
      run:
        shell: bash
    steps:
    - name: Checkout bench scripts
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: src/electron
        sparse-checkout: script/tmp-extract-bench
    - name: Create ReFS Dev Drive
      shell: powershell
      run: powershell -ExecutionPolicy Bypass -File src/electron/script/tmp-extract-bench/make-refs-drive.ps1
    - name: Pick a scratch dir on the roomiest host volume
      shell: powershell
      run: |
        $vol = Get-Volume | Where-Object { $_.DriveLetter -and $_.DriveType -eq 'Fixed' -and $_.FileSystemType -eq 'NTFS' } | Sort-Object SizeRemaining -Descending | Select-Object -First 1
        $scratch = "$($vol.DriveLetter):\extract-bench"
        New-Item -ItemType Directory -Force -Path $scratch | Out-Null
        "HOST_SCRATCH=$scratch" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
        Write-Host "scratch: $scratch ($([math]::Round($vol.SizeRemaining/1GB)) GB free)"
    - name: Install zstd if missing
      run: command -v zstd || choco install zstandard -y --no-progress
    - name: Obtain SAS Key
      uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
      with:
        path: sas-token
        key: sas-key-win-${{ github.run_number }}-${{ github.run_attempt }}
        restore-keys: sas-key-win-${{ github.run_number }}-
        enableCrossOsArchive: true
        fail-on-cache-miss: true
    - name: Download src cache (azcopy)
      env:
        AZURE_AKS_WIN_CACHE_SHARE_NAME: windows-cache
      run: |
        S=$(cygpath -u "$HOST_SCRATCH")
        sas_token=$(jq -r '.sasToken' sas-token)
        account_name=$(jq -r '.accountName' sas-token)
        rm -f sas-token
        s=$(date +%s)
        azcopy copy --log-level=ERROR "https://$account_name.file.core.windows.net/$AZURE_AKS_WIN_CACHE_SHARE_NAME/$CACHE_FILE?$sas_token" "$S/cache.tar.zst"
        e=$(date +%s)
        echo "AZCOPY_SECS=$((e-s))" >> "$GITHUB_ENV"
        ls -la "$S/cache.tar.zst"
    - name: Download shards
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: win-cache-shards
        path: ${{ env.HOST_SCRATCH }}/shards
    - name: Probe the runner
      shell: powershell
      continue-on-error: true
      run: powershell -ExecutionPolicy Bypass -File src/electron/script/tmp-extract-bench/probe.ps1 "$env:HOST_SCRATCH\probe.md"
    - name: Pass 1 - NTFS host volume, Defender as shipped
      env:
        SCRIPT_DIR: ${{ github.workspace }}/src/electron/script/tmp-extract-bench
      run: |
        S=$(cygpath -u "$HOST_SCRATCH"); SCRIPT_DIR=$(cygpath -u "$SCRIPT_DIR")
        R=$S/results-hosted-vm.md
        { echo "## GitHub-hosted Windows VM (windows-latest, $(nproc) cpus) - same cache, three destination filesystems"; echo ""; echo "azcopy download of the cache: ${AZCOPY_SECS}s"; } > "$R"
        SUITE=fs LABEL="destination = NTFS ($HOST_SCRATCH), Defender real-time protection as shipped" \
          CACHE_TARBALL=$S/cache.tar.zst SHARDS_DIR=$S/shards RESULTS=$R BENCH_ROOT=$S/ntfs MICRO_TAR=$S/shards/micro.tar SCRIPT_DIR=$SCRIPT_DIR \
          bash "$SCRIPT_DIR/bench.sh"
    - name: Exclude the NTFS destination from Defender
      shell: powershell
      continue-on-error: true
      run: |
        Add-MpPreference -ExclusionPath "$env:HOST_SCRATCH\ntfs-excluded"
        Get-MpPreference | Select-Object -ExpandProperty ExclusionPath
        Get-MpComputerStatus | Select-Object RealTimeProtectionEnabled | Format-List
    - name: Pass 2 - NTFS host volume, destination excluded from Defender
      if: ${{ !cancelled() }}
      env:
        SCRIPT_DIR: ${{ github.workspace }}/src/electron/script/tmp-extract-bench
      run: |
        S=$(cygpath -u "$HOST_SCRATCH"); SCRIPT_DIR=$(cygpath -u "$SCRIPT_DIR")
        SUITE=fs LABEL="destination = NTFS ($HOST_SCRATCH\ntfs-excluded), excluded from Defender" \
          CACHE_TARBALL=$S/cache.tar.zst SHARDS_DIR=$S/shards RESULTS=$S/results-hosted-vm.md BENCH_ROOT=$S/ntfs-excluded MICRO_TAR=$S/shards/micro.tar SCRIPT_DIR=$SCRIPT_DIR \
          bash "$SCRIPT_DIR/bench.sh"
    - name: Pass 3 - ReFS Dev Drive
      if: ${{ !cancelled() }}
      env:
        SCRIPT_DIR: ${{ github.workspace }}/src/electron/script/tmp-extract-bench
      run: |
        S=$(cygpath -u "$HOST_SCRATCH"); SCRIPT_DIR=$(cygpath -u "$SCRIPT_DIR")
        SUITE=fs LABEL="destination = ${REFS_KIND} (${REFS_ROOT}), trusted" \
          CACHE_TARBALL=$S/cache.tar.zst SHARDS_DIR=$S/shards RESULTS=$S/results-hosted-vm.md BENCH_ROOT="$(cygpath -u "$REFS_ROOT")/root" MICRO_TAR=$S/shards/micro.tar SCRIPT_DIR=$SCRIPT_DIR \
          bash "$SCRIPT_DIR/bench.sh"
    - name: Summary
      if: ${{ !cancelled() }}
      run: |
        S=$(cygpath -u "$HOST_SCRATCH")
        cat "$S/results-hosted-vm.md" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        cat "$S/probe.md" >> "$GITHUB_STEP_SUMMARY" || true
        mkdir -p out && cp "$S"/results-hosted-vm.md "$S"/probe.md out/ 2>/dev/null || true
    - name: Upload results
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      with:
        name: results-hosted-vm
        path: out/
        retention-days: 7
